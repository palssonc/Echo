name: Deploy Echo to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'podcast-shadowing-app/**'
      - '.github/workflows/deploy-podcast-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: podcast-shadowing-app
      - uses: actions/deploy-pages@v4

